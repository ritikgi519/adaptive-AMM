<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            }
          });
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>Adaptive AMM - Dynamic Fee Protocol</title>
    <meta name="description" content="Dynamic-fee automated market maker simulator and DEX dashboard that adjusts swap fees based on volatility and price impact to protect liquidity providers." />
    <meta property="og:title" content="Adaptive AMM - Dynamic Fee Protocol" />
    <meta property="og:description" content="Dynamic-fee automated market maker simulator and DEX dashboard that adjusts swap fees based on volatility and price impact to protect liquidity providers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
